<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Yaren 🖤</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: black;
    font-family: 'Press Start 2P', cursive;
    color: white;
    min-height: 100vh;
    overflow-y: auto; /* Telefon ve masaüstü için kaydırma açık */
    overflow-x: hidden;
}

/* Arka plan parlaklığı */
body::before {
    content: "";
    position: fixed;
    width: 300px;
    height: 300px;
    background: #ffc1e3;
    filter: blur(120px);
    opacity: 0.15;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
    pointer-events: none;
}

/* Container */
.container {
    position: relative;
    margin: 0 auto;
    padding: 50px 20px;
    text-align: center;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* button */
button {
    padding: 15px 25px;
    border: 3px solid #ffc1e3;
    background: black;
    color: #ffc1e3;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: 0.3s;
    position: relative;
    z-index: 3;
}

button:hover {
    background: #ffc1e3;
    color: black;
    box-shadow: 0 0 20px #ffc1e3;
}

/* text */
#message {
    margin-top: 10px;
    font-size: 11px;
    line-height: 2.2;
    opacity: 0;
    transition: 1.5s;
    white-space: pre-line;
    text-shadow: 2px 2px 0px #000;
    width: 100%;
    display: none;
}

/* photo */
#photo {
    margin-top: 40px;
    width: 280px;
    max-width: 85vw;
    border: 4px solid #ffc1e3;
    opacity: 0;
    transform: scale(0.8);
    transition: 1.5s;
    image-rendering: pixelated;
    display: none;
    margin-bottom: 20px;
}

/* ARKA PLAN ANİMASYONLARI */
.pixel-heart, .lily {
    position: fixed;
    width: 6px;
    height: 6px;
    animation: rise linear infinite;
    z-index: 1;
    pointer-events: none;
}

.pixel-heart {
    background: transparent;
    box-shadow:
        6px 0 #ff85c1, 12px 0 #ff85c1, 30px 0 #ff85c1, 36px 0 #ff85c1,
        0 6px #ff85c1, 6px 6px #ff85c1, 12px 6px #ff85c1, 18px 6px #ff85c1, 24px 6px #ff85c1, 30px 6px #ff85c1, 36px 6px #ff85c1, 42px 6px #ff85c1,
        0 12px #ff85c1, 6px 12px #ff85c1, 12px 12px #ff85c1, 18px 12px #ff85c1, 24px 12px #ff85c1, 30px 12px #ff85c1, 36px 12px #ff85c1, 42px 12px #ff85c1,
        6px 18px #ff85c1, 12px 18px #ff85c1, 18px 18px #ff85c1, 24px 18px #ff85c1, 30px 18px #ff85c1, 36px 18px #ff85c1,
        12px 24px #ff85c1, 18px 24px #ff85c1, 24px 24px #ff85c1, 30px 24px #ff85c1,
        18px 30px #ff85c1, 24px 30px #ff85c1;
}

.lily {
    background: #ffeb3b; 
    box-shadow:
        0 -6px white, 0 -12px white,
        0 6px white, 0 12px white,
        -6px 0 white, -12px 0 white,
        6px 0 white, 12px 0 white,
        -6px -6px white, 6px -6px white,
        -6px 6px white, 6px 6px white;
}

@keyframes rise {
    0% { transform: translateY(110vh) scale(0.8); opacity: 0; }
    10% { opacity: 0.7; }
    90% { opacity: 0.7; }
    100% { transform: translateY(-15vh) scale(1.1); opacity: 0; }
}

.fade {
    opacity: 0 !important;
    transform: scale(0.8) !important;
    transition: 0.5s;
    pointer-events: none;
}

/* Responsive */
@media (max-width: 480px) {
    #message {
        font-size: 9px;
        line-height: 1.8;
    }

    #photo {
        width: 90%;
        margin-top: 20px;
    }

    button {
        font-size: 12px;
        padding: 12px 20px;
    }
}
</style>
</head>

<body>

<div class="container">
    <button id="btn" onclick="start()">click</button>
    <div id="message"></div>
    <img id="photo" src="photo.png" alt="Yaren">
</div>

<script>
function createBackgroundElements() {
    for(let i=0; i<15; i++){
        let h = document.createElement("div");
        h.className = "pixel-heart";
        h.style.left = Math.random() * 92 + "vw"; 
        h.style.animationDuration = (5 + Math.random() * 5) + "s";
        h.style.animationDelay = (Math.random() * 5) + "s";
        document.body.appendChild(h);
    }
    for(let i=0; i<10; i++){
        let l = document.createElement("div");
        l.className = "lily";
        l.style.left = Math.random() * 92 + "vw";
        l.style.animationDuration = (6 + Math.random() * 6) + "s";
        l.style.animationDelay = (Math.random() * 6) + "s";
        document.body.appendChild(l);
    }
}
createBackgroundElements();

let text = `yaren askım seni çok seviyorum.
bana ne kadar iyi geldigini bilmiyosun
seninleyken sen hayatımdayken her sey yolunda
tamam bazen huysuzluk yapiyorum ama sonrasında
cok pisman oluyorum senı uzdugum icin kendimden nefret ediyorum
askim ozur dilenmesini sevmiyosun ama
ben ozur dilerim senden
seni cok seviyorum
animasyona zambaklar ekledim fark ettin mi 
hep benimle ol istiyorum.
hep birlikte olalım istiyorum.
birlikte yasayalım istiyorum.
her şeyi birlikte yapalım istiyorum.
seni çok seviyorum.
çok çok çok çok seviyorum.
güzel askım, akıllı aşkım, zeki askım,
gotik askım, bakımlı askım, sapsal askım.
senden once ben yasamiyormusum ve ciddiyim.
bazen inanmasan da bana ben seni cidden cok seviyorum
sana tapıyorum`;

function start(){
    let btn = document.getElementById("btn");
    let msg = document.getElementById("message");
    let photo = document.getElementById("photo");

    btn.classList.add("fade");

    setTimeout(() => {
        btn.style.display = "none";
        msg.style.display = "block";
        photo.style.display = "block";
        msg.textContent = text; // mesajı ekliyoruz

        setTimeout(() => {
            msg.style.opacity = "1";
            setTimeout(() => {
                photo.style.opacity = "1";
                photo.style.transform = "scale(1)";
            }, 1000);
        }, 100);
    }, 500);
}
</script>

</body>
</html>
