<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Yaren 🖤</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100dvh; /* Dinamik yükseklik */
    background: black;
    font-family: 'Press Start 2P', cursive;
    color: white;
    /* Başlangıçta butonu ortalamak için Flex */
    display: flex;
    justify-content: center;
    align-items: center;
    /* BAŞLANGIÇTA KİLİTLİ (Kaydırma yok) */
    overflow: hidden; 
    transition: background 0.5s;
}

/* YAZI GÖRÜNÜNCE EKRAN KİLİDİNİ AÇAN SINIF (JS ile eklenecek) */
body.content-active {
    overflow-y: auto; /* Kaydırmaya izin ver */
    align-items: flex-start; /* İçeriği yukarıdan başlat */
    padding: 60px 0; /* Üstten ve alttan boşluk bırak */
}

/* glow */
body::before {
    content: "";
    position: fixed; /* Arka planda sabit kalsın */
    width: 300px;
    height: 300px;
    background: #ffc1e3;
    filter: blur(120px);
    opacity: 0.15;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
    pointer-events: none;
}

/* container */
.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 600px; /* PC'de çok yayılmasın */
    padding: 0 20px;
    z-index: 2;
    position: relative;
}

/* content-active olduğunda container düzeni */
body.content-active .container {
    justify-content: flex-start;
}

/* button */
button {
    padding: 15px 25px;
    border: 3px solid #ffc1e3;
    background: black;
    color: #ffc1e3;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: 0.3s;
    /* Butonun her zaman görünmesi için */
    position: relative;
    z-index: 3;
}

button:hover {
    background: #ffc1e3;
    color: black;
    box-shadow: 0 0 20px #ffc1e3;
}

/* text */
#message {
    margin-top: 20px;
    font-size: 11px; /* Mobilde daha iyi sığması için biraz küçültüldü */
    line-height: 2.2; /* Okunabilirlik için satır arası açıldı */
    opacity: 0;
    transition: 1.5s;
    white-space: pre-line;
    text-shadow: 2px 2px 0px #000;
    text-align: center;
    width: 100%;
    display: none; /* Başlangıçta yer kaplamasın */
}

/* photo */
#photo {
    margin-top: 40px;
    width: 280px; /* Mobilde daha güvenli bir genişlik */
    max-width: 85vw; /* Ekrandan taşmayı garantili engelle */
    border: 4px solid #ffc1e3;
    opacity: 0;
    transform: scale(0.8);
    transition: 1.5s;
    image-rendering: pixelated;
    display: none; /* Başlangıçta yer kaplamasın */
    margin-bottom: 20px; /* En altta boşluk */
}

/* ARKA PLAN ANİMASYONLARI (Fixed yaparak içerikten ayırdık) */
.pixel-heart, .lily {
    position: fixed; /* İçerik kaydıkça bunlar ekranda kalsın */
    width: 6px;
    height: 6px;
    animation: rise linear infinite;
    z-index: 1;
    pointer-events: none;
}

/* KUSURSUZ PIXEL HEART */
.pixel-heart {
    background: transparent;
    box-shadow:
        6px 0 #ff85c1, 12px 0 #ff85c1, 30px 0 #ff85c1, 36px 0 #ff85c1,
        0 6px #ff85c1, 6px 6px #ff85c1, 12px 6px #ff85c1, 18px 6px #ff85c1, 24px 6px #ff85c1, 30px 6px #ff85c1, 36px 6px #ff85c1, 42px 6px #ff85c1,
        0 12px #ff85c1, 6px 12px #ff85c1, 12px 12px #ff85c1, 18px 12px #ff85c1, 24px 12px #ff85c1, 30px 12px #ff85c1, 36px 12px #ff85c1, 42px 12px #ff85c1,
        6px 18px #ff85c1, 12px 18px #ff85c1, 18px 18px #ff85c1, 24px 18px #ff85c1, 30px 18px #ff85c1, 36px 18px #ff85c1,
        12px 24px #ff85c1, 18px 24px #ff85c1, 24px 24px #ff85c1, 30px 24px #ff85c1,
        18px 30px #ff85c1, 24px 30px #ff85c1;
}

/* KUSURSUZ PIXEL LILY */
.lily {
    background: #ffeb3b; 
    box-shadow:
        0 -6px white, 0 -12px white,
        0 6px white, 0 12px white,
        -6px 0 white, -12px 0 white,
        6px 0 white, 12px 0 white,
        -6px -6px white, 6px -6px white,
        -6px 6px white, 6px 6px white;
}

@keyframes rise {
    0% { transform: translateY(110vh) scale(0.8); opacity: 0; }
    10% { opacity: 0.7; }
    90% { opacity: 0.7; }
    100% { transform: translateY(-15vh) scale(1.1); opacity: 0; }
}

/* fade class */
.fade {
    opacity: 0 !important;
    transform: scale(0.8) !important;
    transition: 0.5s;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="container">
    <button id="btn" onclick="start()">click</button>
    <div id="message"></div>
    <img id="photo" src="photo.png" alt="Yaren">
</div>

<script>
/* Arka plan öğelerini oluştur (Aynen kaldı) */
function createBackgroundElements() {
    for(let i=0; i<15; i++){
        let h = document.createElement("div");
        h.className = "pixel-heart";
        h.style.left = Math.random() * 92 + "vw"; 
        h.style.animationDuration = (5 + Math.random() * 5) + "s";
        h.style.animationDelay = (Math.random() * 5) + "s";
        document.body.appendChild(h);
    }
    for(let i=0; i<10; i++){
        let l = document.createElement("div");
        l.className = "lily";
        l.style.left = Math.random() * 92 + "vw";
        l.style.animationDuration = (6 + Math.random() * 6) + "s";
        l.style.animationDelay = (Math.random() * 6) + "s";
        document.body.appendChild(l);
    }
}
createBackgroundElements();

let text = `yaren askım seni çok seviyorum.
bana ne kadar iyi geldigini bilmiyosun
seninleyken sen hayatımdayken her sey yolunda
tamam bazen huysuzluk yapiyorum ama sonrasında
cok pisman oluyorum senı uzdugum icin kendimden nefret ediyorum
askim ozur dilenmesini sevmiyosun ama
ben ozur dilerim senden
seni cok seviyorum
animasyona zambaklar ekledim fark ettin mi 
hep benimle ol istiyorum.
hep birlikte olalım istiyorum.
birlikte yasayalım istiyorum.
her şeyi birlikte yapalım istiyorum.
seni çok seviyorum.
çok çok çok çok seviyorum.
güzel askım, akıllı askım, zeki askım,
gotik askım, bakımlı askım, sapsal askım.
senden once ben yasamiyormusum ve ciddiyim.
bazen inanmasan da bana ben seni cidden cok seviyorum
sana tapıyorum`;

function start(){
    let btn = document.getElementById("btn");
    let msg = document.getElementById("message");
    let photo = document.getElementById("photo");

    // 1. Butonu soldur
    btn.classList.add("fade");

    setTimeout(() => {
        // 2. Butonu tamamen kaldır, içerik alanlarını hazırla
        btn.style.display = "none";
        msg.style.display = "block";
        photo.style.display = "block";
        
        // 3. KRİTİK ADIM: Body'e scroll izni veren sınıfı ekle
        document.body.classList.add("content-active");

        // 4. Yazıyı belirsizleştir
        setTimeout(() => {
            msg.style.opacity = "1";
            
            // 5. Fotoğrafı belirsizleştir
            setTimeout(() => {
                photo.style.opacity = "1";
                photo.style.transform = "scale(1)";
            }, 1000);
            
        }, 100); 

    }, 500);
}
</script>

</body>
</html>
