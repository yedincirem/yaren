<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Yaren 🖤</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100dvh;
    background: black;
    font-family: 'Press Start 2P', cursive;
    color: white;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    position: relative;
    overflow-x: hidden;
    overflow-y: auto;
}

body::before {
    content: "";
    position: fixed;
    width: 400px;
    height: 400px;
    background: #ffc1e3;
    filter: blur(150px);
    opacity: 0.15;
    z-index: 0;
    pointer-events: none;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 600px;
    padding: 40px 20px 60px;
    z-index: 2;
    min-height: 100dvh;
}

button {
    padding: 15px 20px;
    border: 2px solid #ffc1e3;
    background: black;
    color: #ffc1e3;
    cursor: pointer;
    font-size: clamp(10px, 3vw, 14px);
    font-family: inherit;
    transition: 0.3s;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    white-space: nowrap;
}

button:hover {
    background: #ffc1e3;
    color: black;
    box-shadow: 0 0 15px #ffc1e3;
}

#message {
    margin-top: 30px;
    font-size: clamp(8px, 2.2vw, 13px);
    line-height: 2.2;
    opacity: 0;
    transition: 1.5s;
    white-space: pre-line;
    text-shadow: 2px 2px 0px #000;
    text-align: center;
    width: 100%;
    word-break: break-word;
}

#photo {
    margin-top: 30px;
    width: min(320px, 85vw);
    border: 3px solid #ffc1e3;
    opacity: 0;
    transform: scale(0.8);
    transition: 1.5s;
    image-rendering: pixelated;
    display: block;
}

/* PIXEL HEART */
.pixel-heart {
    position: fixed;
    width: 6px;
    height: 6px;
    background: transparent;
    box-shadow:
        6px 0 #ff85c1, 12px 0 #ff85c1, 30px 0 #ff85c1, 36px 0 #ff85c1,
        0 6px #ff85c1, 6px 6px #ff85c1, 12px 6px #ff85c1, 18px 6px #ff85c1, 24px 6px #ff85c1, 30px 6px #ff85c1, 36px 6px #ff85c1, 42px 6px #ff85c1,
        0 12px #ff85c1, 6px 12px #ff85c1, 12px 12px #ff85c1, 18px 12px #ff85c1, 24px 12px #ff85c1, 30px 12px #ff85c1, 36px 12px #ff85c1, 42px 12px #ff85c1,
        6px 18px #ff85c1, 12px 18px #ff85c1, 18px 18px #ff85c1, 24px 18px #ff85c1, 30px 18px #ff85c1, 36px 18px #ff85c1,
        12px 24px #ff85c1, 18px 24px #ff85c1, 24px 24px #ff85c1, 30px 24px #ff85c1,
        18px 30px #ff85c1, 24px 30px #ff85c1;
    animation: rise linear infinite;
    z-index: 1;
    pointer-events: none;
}

/* PIXEL LILY */
.lily {
    position: fixed;
    width: 6px;
    height: 6px;
    background: #ffeb3b;
    box-shadow:
        0 -6px white, 0 -12px white,
        0 6px white, 0 12px white,
        -6px 0 white, -12px 0 white,
        6px 0 white, 12px 0 white,
        -6px -6px white, 6px -6px white,
        -6px 6px white, 6px 6px white;
    animation: rise linear infinite;
    z-index: 1;
    pointer-events: none;
}

@keyframes rise {
    0% {
        transform: translateY(100vh) scale(0.8);
        opacity: 0;
    }
    10% {
        opacity: 0.8;
    }
    90% {
        opacity: 0.8;
    }
    100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
    }
}

.fade {
    opacity: 0;
    transform: scale(0.8);
    transition: 0.5s;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="container">
    <button id="btn" onclick="start()">click me</button>
    <div id="message"></div>
    <img id="photo" src="photo.png" alt="Yaren">
</div>

<script>
for(let i=0; i<20; i++){
    let h = document.createElement("div");
    h.className = "pixel-heart";
    h.style.left = Math.random() * 90 + "vw";
    h.style.animationDuration = (4 + Math.random() * 5) + "s";
    h.style.animationDelay = (Math.random() * 3) + "s";
    document.body.appendChild(h);
}

for(let i=0; i<15; i++){
    let l = document.createElement("div");
    l.className = "lily";
    l.style.left = Math.random() * 90 + "vw";
    l.style.animationDuration = (5 + Math.random() * 5) + "s";
    l.style.animationDelay = (Math.random() * 4) + "s";
    document.body.appendChild(l);
}

let text = `yaren askım seni çok seviyorum.
bana ne kadar iyi geldigini bilmiyosun
seninleyken sen hayatımdayken her sey yolunda
tamam bazen huysuzluk yapiyorum ama sonrasında
cok pisman oluyorum senı uzdugum icin kendimden nefret ediyorum
askim ozur dilenmesini sevmiyosun ama
ben ozur dilerim senden
seni cok seviyorum
animasyona zambaklar ekledim fark ettin mi 
hep benimle ol istiyorum.
hep birlikte olalım istiyorum.
birlikte yasayalım istiyorum.
her şeyi birlikte yapalım istiyorum.
seni çok seviyorum.
çok çok çok çok seviyorum.
güzel askım, akıllı aşkım, zeki askım,
gotik askım, bakımlı askım, sapsal askım.
senden once ben yasamiyormusum ve ciddiyim.
bazen inanmasan da bana ben seni cidden cok seviyorum
sana tapıyorum`;

function start(){
    let btn = document.getElementById("btn");
    btn.classList.add("fade");

    setTimeout(() => {
        btn.style.display = "none";

        let msg = document.getElementById("message");
        msg.innerHTML = text;
        msg.style.opacity = "1";

        setTimeout(() => {
            let photo = document.getElementById("photo");
            photo.style.opacity = "1";
            photo.style.transform = "scale(1)";
        }, 1200);

    }, 500);
}
</script>

</body>
</html>
